[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chromafix"
version = "0.1.0"
description = "Screening, simulation, and personalized recoloring for color vision deficiency."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies from CLAUDE.md Section 3. Ask the team before adding any.
dependencies = [
  "numpy>=1.26",
  "scikit-image>=0.22",    # CIEDE2000, Lab
  "Pillow>=10.0",          # image I/O
  "opencv-python>=4.8",    # webcam clips only
  "scipy>=1.11",           # parameter tuning
  "fastapi>=0.110",        # server (brings pydantic v2)
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "colour-science>=0.4.4", # reference values for tests only, never runtime code
  "httpx>=0.27",           # required by fastapi.testclient.TestClient
]
neural = [
  "torch>=2.2",
  "torchvision>=0.17",
]

[tool.setuptools.packages.find]
include = ["chromafix*", "server*"]

[tool.setuptools.package-data]
"chromafix.recolor" = ["params/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web", "notebooks", "*.md"]  # don't reformat code blocks in docs

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
